# GitHub Sponsors 配置文件
# 文档：https://docs.github.com/zh/repositories/managing-your-repository-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

# GitHub Sponsors 用户名（如果你的账号开通了 Sponsors）
# github: ahao0625

# 国际赞助平台
# ko_fi: yourusername  # https://ko-fi.com/yourusername
# patreon: yourusername  # https://patreon.com/yourusername
# opencollective: yourusername  # https://opencollective.com/yourusername
# buy_me_a_coffee: yourusername  # https://buymeacoffee.com/yourusername
# liberapay: yourusername  # https://liberapay.com/yourusername
# community_bridge: yourusername  # https://communitybridge.org/
# issuehunt: yourusername  # https://issuehunt.io/

# 自定义链接（可以用于微信/支付宝赞赏码、个人网站等）
# custom: https://your-website.com/sponsor

# 多个平台用数组格式
# github: [ahao0625, another-user]
# custom: ["https://your-website.com/sponsor", "https://another-link.com"]

# ===== 使用说明 =====
# 1. 取消注释你想要使用的平台
# 2. 将 "yourusername" 替换为你的实际用户名
# 3. 提交后，仓库页面会显示 "Sponsor" 按钮
# 4. 国内用户推荐使用：
#    - GitHub Sponsors（如果已开通）
#    - custom: 指向你的微信/支付宝二维码图片链接
#    - buy_me_a_coffee: 国际用户友好

# 示例配置（取消注释使用）：
# github: ahao0625
# custom: https://your-website.com/sponsor-page
